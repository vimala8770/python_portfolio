databases:
  - name: vimala-portfolio-db
    plan: free
    databaseName: vimala_portfolio
    user: vimala_portfolio

services:
  - type: web
    name: vimala-portfolio
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SERVE_MEDIA
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: vimala-portfolio-db
          property: connectionString
