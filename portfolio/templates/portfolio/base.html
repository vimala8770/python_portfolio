{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_profile.full_name }} | {{ site_profile.title }}</title>
    <meta name="description" content="{{ site_profile.tagline }}">
    <meta name="author" content="{{ site_profile.full_name }}">
    <meta property="og:title" content="{{ site_profile.full_name }} | {{ site_profile.title }}">
    <meta property="og:description" content="{{ site_profile.tagline }}">
    <meta property="og:type" content="website">
    <link rel="icon" href="{% static 'portfolio/img/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portfolio/css/styles.css' %}">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include "portfolio/includes/navbar.html" %}

    <main id="main">
        {% block content %}{% endblock %}
    </main>

    {% include "portfolio/includes/footer.html" %}

    <button type="button" class="back-to-top" id="backToTop" aria-label="Back to top">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'portfolio/js/main.js' %}"></script>
</body>
</html>
